name: Tests
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  workspace:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: raxos_test
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysqladmin ping --silent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_DATABASE: raxos_test
        ports: ['3307:3306']
        options: >-
          --health-cmd "mariadb-admin ping --silent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      RAXOS_REDIS_HOST: 127.0.0.1
      RAXOS_REDIS_PORT: 6379
      RAXOS_MYSQL_DSN: 'mysql:host=127.0.0.1;port=3306;dbname=raxos_test'
      RAXOS_MARIADB_DSN: 'mysql:host=127.0.0.1;port=3307;dbname=raxos_test'
      RAXOS_MYSQL_USER: root
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: bcmath, ctype, dom, fileinfo, gd, intl, json, mbstring, openssl, pdo, pdo_mysql, pdo_sqlite, redis, simplexml, zip
          coverage: xdebug
          tools: composer:v2
      - uses: actions/cache@v4
        with:
          path: ~/.cache/composer/files
          key: composer-${{ runner.os }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-
      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Validate workspace and packages
        run: php tools/validate.php
      - name: Lint PHP sources and tests
        run: composer test:lint
      - name: Run all library suites
        run: php -d memory_limit=2G vendor/bin/pest --log-junit=reports/junit.xml --coverage-clover=reports/clover.xml
      - name: Upload test and coverage results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: raxos-test-results
          path: |
            reports/junit.xml
            reports/clover.xml
          if-no-files-found: warn
